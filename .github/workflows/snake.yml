name: snake
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#a8322a&color_dots=#efe5cd,#e2c36c,#c39a45,#4a68c8,#2c479a
            dist/snake-dark.svg?color_snake=#e2c36c&color_dots=#1a1d2a,#22306e,#4a68c8,#c39a45,#ecd58a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
