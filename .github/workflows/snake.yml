name: snake
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e0382c&color_dots=#ebedf0,#f5c9a0,#f0a04a,#e0382c,#7a1a14
            dist/snake-dark.svg?color_snake=#f0a04a&color_dots=#161b22,#4a1410,#8a2018,#e0382c,#f0a04a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
