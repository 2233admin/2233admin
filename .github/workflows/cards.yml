name: profile cards
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main, living-page]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Draw the page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          pip install --quiet pillow
          mkdir -p dist
          python scripts/fetch.py dist/data.json
          python scripts/talk.py assets/whale/idle.gif dist/talk.svg dist/data.json
          python scripts/building.py assets/whale dist/nightshift dist/data.json
          python scripts/card.py assets/whale/thumbs-up.gif dist/card.svg dist/data.json
          rm -f dist/talk_prev.svg
      - name: Pin ${{ github.repository_owner }}/obsidian-llm-wiki
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=obsidian-llm-wiki&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-obsidian-llm-wiki.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ github.repository_owner }}/opencli-Razormind
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=opencli-Razormind&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-opencli-Razormind.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ github.repository_owner }}/qmtcli
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=qmtcli&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-qmtcli.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ github.repository_owner }}/cli2skill
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cli2skill&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-cli2skill.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ github.repository_owner }}/glyph-arts
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=glyph-arts&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-glyph-arts.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ${{ github.repository_owner }}/motion.md
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=motion.md&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-motion.md.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin XartLab/design-pipeline
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=XartLab&repo=design-pipeline&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-XartLab-design-pipeline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin XartLab/code-intel-pipeline
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=XartLab&repo=code-intel-pipeline&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-XartLab-code-intel-pipeline.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin XartLab/dream-harness
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=XartLab&repo=dream-harness&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-XartLab-dream-harness.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin ccch1mneyyy/dsh-Go
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=ccch1mneyyy&repo=dsh-Go&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-ccch1mneyyy-dsh-Go.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e0382c&color_dots=#ebedf0,#f5c9a0,#f0a04a,#e0382c,#7a1a14
            dist/snake-dark.svg?color_snake=#f0a04a&color_dots=#161b22,#4a1410,#8a2018,#e0382c,#f0a04a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
