name: profile cards
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: mkdir -p dist
      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&rank_icon=github&ring_color=e0382c&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin obsidian-llm-wiki
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=obsidian-llm-wiki&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-obsidian-llm-wiki.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin opencli-Razormind
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=opencli-Razormind&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-opencli-Razormind.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin qmtcli
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=qmtcli&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-qmtcli.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin cli2skill
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=cli2skill&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-cli2skill.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin glyph-arts
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=glyph-arts&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-glyph-arts.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin motion.md
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=${{ github.repository_owner }}&repo=motion.md&title_color=e0382c&text_color=8b90b8&icon_color=f0a04a&bg_color=00000000&hide_border=true
          path: dist/pin-motion.md.svg
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#e0382c&color_dots=#ebedf0,#f5c9a0,#f0a04a,#e0382c,#7a1a14
            dist/snake-dark.svg?color_snake=#f0a04a&color_dots=#161b22,#4a1410,#8a2018,#e0382c,#f0a04a
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
